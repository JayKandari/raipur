<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raipur Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <h1>Raipur Calculator</h1>

    <form id="calc-form" novalidate>
      <div class="fields">
        <div class="field">
          <label for="operand1">Number 1</label>
          <input id="operand1" type="text" inputmode="decimal" autocomplete="off">
        </div>

        <div class="field">
          <label for="operation">Operation</label>
          <select id="operation">
            <option value="">Select</option>
            <option value="+">+</option>
            <option value="−">−</option>
            <option value="×">×</option>
            <option value="÷">÷</option>
          </select>
        </div>

        <div class="field">
          <label for="operand2">Number 2</label>
          <input id="operand2" type="text" inputmode="decimal" autocomplete="off">
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="submit">Calculate</button>
        <button type="button" id="clear" class="secondary">Clear</button>
      </div>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>
  </main>

  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
